    <script>
      (function() {
        // Mock Vite HMR WebSocket in proxy / cloud run environments where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          const MockWebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const isViteHmr = (Array.isArray(protocols) ? protocols.includes('vite-hmr') : protocols === 'vite-hmr') ||
                              urlStr.includes('vite') ||
                              (window.location && urlStr.includes(window.location.host));

            if (isViteHmr) {
              const listeners = {};
              const mockWs = {
                readyState: 1, // WebSocket.OPEN
                url: urlStr,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(event, cb) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { cb({ type: 'open' }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };

              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') {
                  try { mockWs.onopen({ type: 'open' }); } catch(e) {}
                }
              }, 0);

              return mockWs;
            }

            return new OrigWebSocket(url, protocols);
          };

          MockWebSocket.prototype = OrigWebSocket.prototype;
          MockWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          MockWebSocket.OPEN = OrigWebSocket.OPEN;
          MockWebSocket.CLOSING = OrigWebSocket.CLOSING;
          MockWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = MockWebSocket;
        }

        // Suppress Vite HMR WebSocket notices in proxy / cloud run environments
        const isWsNoise = function(val) {
          if (!val) return false;
          const s = typeof val === 'object' ? (val.message || val.stack || JSON.stringify(val)) : String(val);
          return s.includes('WebSocket') || s.includes('ws://') || s.includes('wss://') || s.includes('@vite/client');
        };

        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.some(arg => isWsNoise(arg))) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(arg => isWsNoise(arg))) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.onerror = function(message, source, lineno, colno, error) {
          if (isWsNoise(message) || isWsNoise(source) || (error && isWsNoise(error))) {
            return true;
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (event && (isWsNoise(event.message) || isWsNoise(event.filename) || isWsNoise(event.error))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && (isWsNoise(event.reason) || (event.reason && isWsNoise(event.reason)))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
